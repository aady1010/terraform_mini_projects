name: Deploy to AWS ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1                  # Replace with your AWS region if different
  ECR_REPOSITORY: devops-node-api        # Name defined in ecs.tf
  ECS_SERVICE: node-api-service          # Service name defined in ecs.tf
  ECS_CLUSTER: devops-ecs-cluster        # Cluster name defined in ecs.tf
  ECS_TASK_DEFINITION: task-definition.json

jobs:
  deploy:
    name: Deploy Image to Amazon ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        id: build-image
        working-directory: ./terra/aws-3-tier-infra/app   # <-- Tells Docker to build inside the app subfolder
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

          # Step 1: Inject your new Docker image tag into your task definition template
      - name: Render Amazon ECS task definition
        id: render-web-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
         task-definition: terra/aws-3-tier-infra/task-definition.json  # Path to your template JSON file in your repo
         container-name: node-api-container        # Container name defined inside task-definition.json
         image: ${{ steps.build-image.outputs.image }} # Your updated ECR image URI

# Step 2: Deploy the newly rendered task definition to ECS
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
         task-definition: ${{ steps.render-web-container.outputs.task-definition }} # <--- THIS IS WHAT WAS MISSING
         service: your-ecs-service-name
         cluster: your-ecs-cluster-name
         wait-for-service-stability: true
      
